<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão La Rose - Smart Waste</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">

     <!-- 🚀 PERFORMANCE -->
    <link rel="preload" href="css/style.css?v=13.2" as="style">
    <link rel="preload" href="js/app.js?v=13.2" as="script">
    <link rel="stylesheet" href="css/style.css?v=13.2">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <meta name="theme-color" content="#090E17">
</head>

<body id="admin-page" class="page-fade">

    <!-- Modal Detalhes -->
    <div id="modal-detalhes" class="modal-overlay hidden">
        <div class="modal-estruturado pop-in">
            <div class="modal-cabecalho">
                <div>
                    <h3 class="titulo-modal-lote">Resumo do Lote</h3>
                    <p id="detalhe-data-op"></p>
                </div>
                <div id="detalhe-loja" class="badge-loja">LOJA</div>
            </div>

            <div class="modal-corpo">
                <table class="tabela-detalhes">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th class="text-right">Qtd/Peso</th>
                        </tr>
                    </thead>
                    <tbody id="lista-itens-detalhe"></tbody>
                </table>
            </div>

            <div class="modal-rodape">
                <button onclick="window.fecharModalDetalhes()" class="btn-outline">FECHAR</button>
                <button id="btn-acao-lancamento" class="btn-entrar">✅ DAR BAIXA</button>
            </div>
        </div>
    </div>

    <!-- Modal Somar -->
    <div id="modal-somar" class="modal-overlay hidden">
        <div class="modal-centered pop-in">
            <div class="modal-icon modal-success">📊</div>
            <h3>Somar Lotes?</h3>
            <p class="modal-msg" id="msg-somar"></p>

            <div class="modal-actions">
                <button id="btn-confirmar-somar" class="btn-entrar">SOMAR LOTES</button>
                <button onclick="document.getElementById('modal-somar').classList.add('hidden')" class="cancel-link">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal Sair -->
    <div id="modal-sair-admin" class="modal-overlay hidden">
        <div class="modal-centered pop-in">
            <div class="modal-icon">⚠️</div>
            <h3>Deseja sair?</h3>
            <p class="modal-msg">Você será desconectado do painel administrativo.</p>

            <div class="modal-actions">
                <button id="btn-confirmar-sair-admin" class="btn-entrar btn-rosa">SIM, QUERO SAIR</button>
                <button onclick="document.getElementById('modal-sair-admin').classList.add('hidden')" class="cancel-link">CANCELAR</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <header class="header-app">
            <div>
                <div class="badge-loja">👤PAINEL ADMIN</div>
                <h1 class="nome-operador">Painel La Rose</h1>
            </div>

            <div style="display:flex; gap:10px;">
                <button onclick="window.location.reload()" class="btn-outline">
                   🔄
                </button>

                <button id="btn-logout" class="btn-outline">
                    SAIR
                </button>
            </div>
        </header>

        <main class="fade-in-up admin-main">

            <!-- RESUMO -->
            <div class="glass-card overlay resumo-admin-card">
                <div class="resumo-admin-info">
                    <small id="titulo-resumo" class="resumo-admin-label">Pendentes</small>
                    <h2 id="resumo-total" class="resumo-admin-total">0</h2>
                </div>

                <div class="resumo-admin-acoes">
                    <button id="btn-excel" class="btn-entrar">📊 EXCEL</button>
                    <button onclick="window.gerarRelatorioPDF()" class="btn-entrar btn-rosa">📄 PDF</button>
                </div>
            </div>

            <!-- FILTRO -->
            <div class="filtro-data-box">
                <div class="filtro-data-linha">
                    <input type="date" id="filtroData" class="input-premium">
                    <button onclick="filtrarPorData()" class="btn-entrar btn-filtrar-data">
                        FILTRAR POR DATA
                    </button>
                </div>
            </div>

            <!-- TABS -->
            <div class="tabs-container">
                <button id="tab-pendentes" class="tab-btn active" onclick="window.mudarAba('pendentes')">⏳ PENDENTES</button>
                <button id="tab-consolidados" class="tab-btn" onclick="window.mudarAba('consolidados')">📊 SOMADOS</button>
                <button id="tab-lancados" class="tab-btn" onclick="window.mudarAba('lancados')">✅ LANÇADOS</button>
            </div>

            <!-- SELEÇÃO -->
            <div id="selection-bar" class="selection-bar-admin"></div>

            <!-- LISTA -->
            <div id="lista-admin" class="lista-admin-box"></div>
        </main>
    </div>

    <!-- MODAL GLOBAL -->
    <div id="modal-global" class="modal-overlay hidden">
        <div class="modal-centered pop-in">
            <div class="modal-icon">⚠️</div>
            <h3 id="modalTitulo">Título</h3>
            <p class="modal-msg" id="modalMensagem"></p>

            <div class="modal-actions">
                <button id="modalConfirmar" class="btn-entrar">OK</button>
                <button id="modalCancelar" class="cancel-link">Cancelar</button>
            </div>
        </div>
    </div>

   <script src="js/modal.js?v=13.2"></script>
<script type="module" src="js/app.js?v=13.2"></script>
</body>
</html>
