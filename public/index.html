<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Rose - Smart Waste</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">

    

     <!-- 🚀 PERFORMANCE -->
    <link rel="preload" href="css/style.css?v=13.2" as="style">
    <link rel="preload" href="js/app.js?v=13.2" as="script">
    <link rel="stylesheet" href="css/style.css?v=13.2">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <meta name="theme-color" content="#090E17">
</head>

<body id="index-page">
    <div class="app-container">

        <!-- SPLASH -->
        <div id="splash-screen" class="splash-screen">
            <img src="assets/images/logo.png" class="splash-logo" alt="La Rose">

            <div class="splash-dots">
                <span class="splash-dot dot-delay-0"></span>
                <span class="splash-dot dot-delay-1"></span>
                <span class="splash-dot dot-delay-2"></span>
            </div>

            <p class="splash-text fade-in-up">Smart Waste System</p>
        </div>

        <!-- LOGIN -->
        <main id="login-page" class="login-page">
            <div class="glass-card login-card">

                <h2 class="titulo-login">Acesso La Rose</h2>
                <p class="subtitulo-login">Smart Waste </p>

                <!-- PERFIL -->
                <div id="seletor-perfil">
                    <button onclick="window.definirPerfil('operacional')" class="btn-entrar mb-15">
                        👥 ACESSO EQUIPE
                    </button>

                    <button onclick="window.definirPerfil('admin')" class="btn-outline w-full">
                        🛡️ ACESSO GESTÃO (ADMIN)
                    </button>
                </div>

                <!-- LOGIN ADMIN -->
                <div id="campos-auth" class="hidden fade-in-up">
                    <input type="email" id="email" placeholder="E-mail" class="input-premium mb-15">
                    <input type="password" id="senha" placeholder="Senha" class="input-premium mb-25">

                    <button id="btn-fazer-login" class="btn-entrar">
                        ENTRAR NO SISTEMA
                    </button>

                    <button onclick="window.location.reload()" class="btn-manual-helper btn-sem-borda">
                        VOLTAR
                    </button>
                </div>

                <!-- OPERACIONAL -->
                <div id="config-operacional" class="hidden fade-in-up">

                    <!-- LOJA -->
                    <div id="etapa-loja">
                        <p class="section-label">
                            📍 Selecione a Unidade
                        </p>

                        <div class="grid-cards unidades-grid">
                            <div class="flash-card" onclick="window.selecionarLoja('entre_lagos')">
                                <div class="avatar-circle">EL</div>
                                <p>Entre Lagos</p>
                            </div>

                            <div class="flash-card" onclick="window.selecionarLoja('itapoa_parque')">
                                <div class="avatar-circle">IP</div>
                                <p>Itapoã Parque</p>
                            </div>
                        </div>

                        <button onclick="window.resetar()" class="btn-manual-helper btn-sem-borda btn-sair-sistema">
                            ❌ SAIR DO SISTEMA
                        </button>
                    </div>

                    <!-- OPERADOR -->
                    <div id="etapa-operador" class="hidden">
                        <p class="section-label">
                            👥 Quem está operando?
                        </p>

                        <div id="container-operadores" class="grid-cards operadores-grid"></div>

                        <button onclick="window.voltarParaLoja()" class="btn-manual-helper btn-sem-borda mt-20">
                            ALTERAR UNIDADE
                        </button>
                    </div>

                    <button id="btn-iniciar" onclick="window.location.href='lancamento.html'" class="btn-entrar hidden fade-in-up mt-30">
                        INICIAR 
                    </button>

                </div>
            </div>
        </main>
    </div>

    <!-- MODAL GLOBAL -->
    <div id="modal-global" class="modal-overlay hidden">
        <div class="modal-centered pop-in">
            <div class="modal-icon">⚠️</div>
            <h3 id="modalTitulo">Título</h3>
            <p class="modal-msg" id="modalMensagem"></p>

            <div class="modal-actions">
                <button id="modalConfirmar" class="btn-entrar">OK</button>
                <button id="modalCancelar" class="cancel-link">Cancelar</button>
            </div>
        </div>
    </div>

    <style>
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }
    </style>

    <script src="js/modal.js?v=13.2"></script>
<script type="module" src="js/app.js?v=13.2"></script>
</body>
</html>
