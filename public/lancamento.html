<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lançamento - La Rose</title>
    <link rel="stylesheet" href="css/style.css?v=13.0">
    <meta name="theme-color" content="#f1f5f9">
</head>
<body id="app-page" style="opacity:0; transition:0.5s;">
    
    <div id="modal-sair" class="modal-overlay hidden">
        <div class="modal-estruturado fade-in-up" style="max-width: 340px; padding: 30px; text-align: center;">
            <div style="font-size: 48px; margin-bottom: 15px;">⚠️</div>
            <h3 style="color:var(--verde-dark); font-size: 24px; margin-bottom:12px; font-weight: 900; letter-spacing: -1px;">Deseja sair?</h3>
            <p style="font-size:15px; color:var(--texto-suave); margin-bottom:35px; line-height: 1.5;">O lote atual que você está preenchendo será apagado permanentemente.</p>
            <div style="display:flex; flex-direction: column; gap:12px;">
                <button onclick="window.confirmarSaida(true)" class="btn-entrar btn-rosa">SIM, QUERO SAIR</button>
                <button onclick="window.confirmarSaida(false)" class="btn-manual-helper" style="margin-top:0;">CANCELAR E VOLTAR</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <header class="header-app">
            <div>
                <div class="badge-loja">📍 <span id="display-loja">LOJA</span></div>
                <h1 class="nome-operador" id="display-operador">Operador</h1>
            </div>
            <button onclick="window.abrirModalSair()" class="btn-outline">SAIR</button>
        </header>

        <main class="glass-card overlay fade-in-up">
            <div style="margin-bottom: 25px;">
                <label>1. Buscar Produto</label>
                <div style="position: relative;">
                    <input type="text" id="busca-produto" placeholder="Digite nome ou código..." class="input-premium">
                    <div id="sugestoes" class="hidden" style="position:absolute; width:100%; top:calc(100% + 8px); max-height:250px; overflow-y:auto; z-index:50; border-radius: var(--radius-md);"></div>
                </div>
            </div>
            
            <button onclick="window.ativarModoManual()" class="btn-manual-helper">Não encontrou? Digite aqui</button>

            <div style="margin-top: 40px;">
                <label>2. Peso Bruto / Quantidade</label>
                <div style="position:relative; margin-top:8px;">
                    <input type="text" id="peso-input" placeholder="0,000" class="input-peso" inputmode="decimal">
                    <span id="label-unidade" style="position:absolute; right:30px; top:50%; transform:translateY(-50%); font-weight:900; color:var(--texto-suave); font-size: 20px;">KG</span>
                </div>
            </div>
            <button id="btn-adicionar" class="btn-entrar" style="margin-top:35px;">ADICIONAR AO LOTE</button>
        </main>

        <div id="lista-conferencia" style="padding:25px; width: 100%; margin: 0 auto 140px;"></div>

        <footer class="footer-action">
            <div>
                <span style="display:block; color:var(--texto-suave); font-weight:800; font-size:11px; text-transform: uppercase; letter-spacing: 1px;">TOTAL DO LOTE</span>
                <span id="total-itens" style="font-size:36px; font-weight:900; color: var(--verde-dark); letter-spacing: -2px; line-height: 1;">0</span>
            </div>
            <button id="btn-finalizar-lote" class="btn-entrar" style="width: auto; padding: 20px 40px; border-radius: 100px;">FINALIZAR</button>
        </footer>
    </div>

    <script type="module" src="js/app.js?v=12.3"></script>
</body>
</html>
