<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lançamento - La Rose</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="La Rose">
    <meta name="theme-color" content="#0f172a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css?v=3.4">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

    <style>
    *, *::before, *::after { box-sizing: border-box; }

    /* ═══════════════════════════════════════
       OVERRIDES VISUAIS — mantém IDs do app.js
       Apenas CSS novo sobre a estrutura original
    ═══════════════════════════════════════ */

    body#app-page {
        background: #f1f5f9;
        font-family: 'Inter', system-ui, sans-serif;
    }

    /* ── Header ── */
    .header-app {
        background: #0f172a !important;
        padding: 10px 16px 10px !important;
        padding-top: calc(10px + env(safe-area-inset-top, 0px)) !important;
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        gap: 10px;
        box-shadow: 0 2px 12px rgba(0,0,0,.2) !important;
        position: sticky; top: 0; z-index: 100;
    }
    .badge-loja {
        display: inline-flex !important; align-items: center !important; gap: 5px !important;
        padding: 3px 10px !important; border-radius: 100px !important;
        background: rgba(16,185,129,.18) !important; color: #34d399 !important;
        font-size: 10.5px !important; font-weight: 800 !important;
        text-transform: uppercase !important; letter-spacing: .4px !important;
        border: none !important; width: fit-content !important;
    }
    .nome-operador {
        font-size: 12px !important; font-weight: 600 !important;
        color: rgba(255,255,255,.55) !important;
        margin-top: 2px !important; margin-bottom: 0 !important;
    }
    .btn-sair-header {
        padding: 7px 12px !important; border-radius: 9px !important;
        background: rgba(225,29,72,.1) !important;
        border: 1px solid rgba(225,29,72,.2) !important;
        color: rgba(248,113,113,.9) !important;
        font-size: 11px !important; font-weight: 700 !important;
        font-family: 'Inter', sans-serif !important; flex-shrink: 0;
    }
    .btn-sair-header:hover { background: rgba(225,29,72,.18) !important; }

    /* ── Container principal ── */
    .app-container {
        max-width: 540px;
        margin: 0 auto;
        padding: 0 0 calc(70px + env(safe-area-inset-bottom));
    }

    /* ── Card principal (glassmorphism → card limpo) ── */
    .lancamento-main {
        background: #fff !important;
        border: 1px solid #e2e8f0 !important;
        border-radius: 20px !important;
        padding: 20px 18px !important;
        margin: 14px 14px 0 !important;
        box-shadow: 0 1px 6px rgba(0,0,0,.05) !important;
        backdrop-filter: none !important;
    }

    /* ── Labels ── */
    .campo-label {
        font-size: 10px !important; font-weight: 800 !important; color: #94a3b8 !important;
        text-transform: uppercase !important; letter-spacing: 1px !important;
        margin-bottom: 8px !important; display: block !important;
    }
    .campo-label-sm { font-size: 10px !important; }

    /* ── Busca ── */
    #busca-produto {
        background: #f8fafc !important; border: 1.5px solid #e2e8f0 !important;
        border-radius: 12px !important; padding: 12px 14px !important;
        font-size: 14px !important; font-weight: 600 !important;
        font-family: 'Inter', sans-serif !important; color: #0f172a !important;
        outline: none !important; width: 100%;
    }
    #busca-produto:focus { border-color: #10b981 !important; background: #fff !important; }
    #busca-produto::placeholder { color: #94a3b8 !important; font-weight: 500 !important; }

    /* ── Sugestões autocomplete ── */
    #sugestoes.sugestoes-box {
        background: #fff !important; border: 1.5px solid #e2e8f0 !important;
        border-radius: 12px !important; margin-top: 4px !important;
        max-height: 220px !important; overflow-y: auto !important;
        box-shadow: 0 8px 24px rgba(0,0,0,.1) !important;
    }
    .sugestao-item {
        padding: 11px 14px !important; font-size: 13px !important;
        font-weight: 600 !important; color: #0f172a !important;
        cursor: pointer !important; border-bottom: 1px solid #f8fafc !important;
        font-family: 'Inter', sans-serif !important;
    }
    .sugestao-item:last-child { border-bottom: none !important; }
    .sugestao-item:hover, .sugestao-item.ativo { background: #f0fdf4 !important; color: #059669 !important; }

    /* ── Toggle de unidade (catalog) ── */
    .campo-toggle-unidade { margin: 10px 0 !important; }
    .unit-toggle {
        display: grid !important; grid-template-columns: 1fr 1fr !important;
        background: #f1f5f9 !important; border-radius: 11px !important;
        padding: 3px !important; gap: 0 !important; border: none !important;
    }
    .unit-btn {
        padding: 9px 8px !important; border-radius: 9px !important;
        background: transparent !important; border: none !important;
        font-size: 13px !important; font-weight: 700 !important;
        font-family: 'Inter', sans-serif !important;
        color: #64748b !important; cursor: pointer !important;
        transition: all .15s !important; text-align: center !important;
    }
    .unit-btn.active {
        background: #10b981 !important; color: #fff !important;
        box-shadow: 0 2px 8px rgba(16,185,129,.3) !important;
    }

    /* ── Peso ── */
    .campo-peso-bloco { margin: 12px 0 !important; }
    .peso-wrapper {
        display: flex !important; gap: 8px !important; align-items: stretch !important;
    }
    #peso-input {
        flex: 1 !important; padding: 13px 14px !important;
        background: #f8fafc !important; border: 1.5px solid #e2e8f0 !important;
        border-radius: 12px !important; font-size: 20px !important;
        font-weight: 900 !important; font-family: 'Roboto', sans-serif !important;
        color: #0f172a !important; outline: none !important; text-align: center !important;
    }
    #peso-input:focus { border-color: #10b981 !important; background: #fff !important; }
    .label-unidade-peso {
        display: flex !important; align-items: center !important; justify-content: center !important;
        padding: 0 16px !important; background: #f1f5f9 !important;
        border: 1.5px solid #e2e8f0 !important; border-radius: 12px !important;
        font-size: 14px !important; font-weight: 800 !important; color: #64748b !important;
        min-width: 52px !important;
    }

    /* ── Botão Adicionar ── */
    .btn-adicionar-lote {
        width: 100% !important; padding: 15px !important;
        background: linear-gradient(135deg,#10b981,#059669) !important;
        border: none !important; border-radius: 13px !important;
        font-size: 15px !important; font-weight: 900 !important;
        font-family: 'Roboto', sans-serif !important; color: #fff !important;
        cursor: pointer !important; margin-top: 4px !important;
        box-shadow: 0 4px 16px rgba(16,185,129,.35) !important;
        letter-spacing: .2px !important;
    }
    .btn-adicionar-lote:disabled { opacity: .4 !important; cursor: not-allowed !important; box-shadow: none !important; }

    /* ── Área manual (extra) ── */
    .manual-area {
        background: #f8fafc !important; border: 1.5px dashed #cbd5e1 !important;
        border-radius: 12px !important; padding: 14px !important; margin: 10px 0 !important;
    }
    .btn-confirmar-produto {
        width: 100% !important; margin-top: 10px !important; border-radius: 11px !important;
    }

    /* ── Lista conferência ── */
    .lista-conferencia-box {
        background: #fff !important; border: 1px solid #e2e8f0 !important;
        border-radius: 20px !important; overflow: hidden !important;
        margin: 10px 14px 0 !important;
        box-shadow: 0 1px 6px rgba(0,0,0,.05) !important;
    }
    .lista-conferencia-box:empty { display: none !important; }

    /* Itens individuais no lote */
    .item-lote-row {
        display: flex !important; align-items: center !important; gap: 8px !important;
        padding: 10px 14px !important; border-bottom: 1px solid #f8fafc !important;
        transition: background .12s !important;
    }
    .item-lote-row:last-child { border-bottom: none !important; }
    .item-lote-row:hover { background: #f8fafc !important; }
    .item-lote-nome {
        flex: 1 !important; font-size: 13px !important; font-weight: 700 !important;
        color: #0f172a !important; overflow: hidden !important;
        text-overflow: ellipsis !important; white-space: nowrap !important;
    }
    .item-lote-peso {
        font-size: 12px !important; font-weight: 800 !important; color: #374151 !important;
        background: #f1f5f9 !important; padding: 3px 10px !important;
        border-radius: 100px !important; white-space: nowrap !important; flex-shrink: 0 !important;
    }
    .item-lote-del {
        width: 26px !important; height: 26px !important; border-radius: 7px !important;
        background: rgba(225,29,72,.07) !important; border: none !important;
        color: #e11d48 !important; font-size: 14px !important; cursor: pointer !important;
        display: flex !important; align-items: center !important;
        justify-content: center !important; flex-shrink: 0 !important;
    }
    .item-lote-del:hover { background: rgba(225,29,72,.14) !important; }

    /* Cabeçalho da lista */
    .lista-conferencia-header {
        display: flex !important; align-items: center !important;
        justify-content: space-between !important;
        padding: 11px 14px !important; background: #f8fafc !important;
        border-bottom: 1px solid #f1f5f9 !important;
    }
    .lista-conf-titulo {
        font-size: 11px !important; font-weight: 800 !important;
        text-transform: uppercase !important; letter-spacing: .5px !important; color: #0f172a !important;
    }
    .lista-conf-count {
        font-size: 11px !important; font-weight: 800 !important; color: #10b981 !important;
        background: rgba(16,185,129,.1) !important; padding: 2px 9px !important;
        border-radius: 100px !important; border: 1px solid rgba(16,185,129,.2) !important;
    }

    /* ── Lotes enviados hoje ── */
    #secao-lotes-hoje {
        background: #fff !important; border: 1px solid #e2e8f0 !important;
        border-radius: 20px !important; overflow: hidden !important;
        margin: 10px 14px 0 !important;
        box-shadow: 0 1px 6px rgba(0,0,0,.05) !important;
    }
    .lotes-hoje-header {
        font-size: 11px !important; font-weight: 800 !important;
        text-transform: uppercase !important; letter-spacing: .5px !important;
        color: #0f172a !important; padding: 11px 14px !important;
        border-bottom: 1px solid #f1f5f9 !important; background: #f8fafc !important;
    }
    #lotes-hoje-lista { padding: 6px 8px !important; }
    .lote-enviado-item {
        display: flex !important; align-items: center !important; gap: 10px !important;
        padding: 9px 10px !important; background: #f8fafc !important;
        border-radius: 10px !important; border-left: 3px solid #10b981 !important;
        margin-bottom: 4px !important;
    }
    .lote-enviado-num {
        font-size: 10px !important; font-weight: 800 !important; color: #10b981 !important;
        background: rgba(16,185,129,.1) !important; padding: 2px 7px !important;
        border-radius: 100px !important; flex-shrink: 0 !important;
    }

    /* ── Footer ── */
    .footer-action {
        position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important;
        background: #fff !important; border-top: 1px solid #e2e8f0 !important;
        padding: 10px 14px calc(10px + env(safe-area-inset-bottom)) !important;
        display: flex !important; align-items: center !important; gap: 10px !important;
        box-shadow: 0 -4px 20px rgba(0,0,0,.07) !important;
        z-index: 50 !important; max-width: 540px !important; margin: 0 auto !important;
    }
    .footer-total-label {
        font-size: 10px !important; font-weight: 700 !important; color: #94a3b8 !important;
        text-transform: uppercase !important; letter-spacing: .5px !important;
        display: block !important;
    }
    #total-itens {
        font-size: 20px !important; font-weight: 900 !important; color: #0f172a !important;
        letter-spacing: -.5px !important; line-height: 1 !important;
        font-family: 'Roboto', sans-serif !important; display: block !important;
    }
    .btn-finalizar-lote {
        display: flex !important; align-items: center !important; gap: 7px !important;
        padding: 13px 22px !important; border-radius: 13px !important;
        background: linear-gradient(135deg,#0f172a,#1e293b) !important;
        border: none !important; color: #fff !important;
        font-size: 14px !important; font-weight: 900 !important;
        font-family: 'Roboto', sans-serif !important; cursor: pointer !important;
        box-shadow: 0 4px 16px rgba(15,23,42,.3) !important;
        margin-left: auto !important; flex-shrink: 0 !important;
        letter-spacing: .2px !important;
    }
    .btn-finalizar-lote:disabled { opacity: .35 !important; cursor: not-allowed !important; }
    </style>
</head>

<!-- IMPORTANTE: body#app-page — ID original que app.js detecta -->
<body id="app-page" class="page-fade">

    <!-- ═══ MODAIS (IDs originais mantidos) ═══ -->

    <div id="modal-sair" class="modal-overlay hidden">
        <div class="modal-centered pop-in">
            <div class="modal-icon">⚠️</div>
            <h3>Deseja sair?</h3>
            <p class="modal-msg">O lote atual será apagado permanentemente.</p>
            <div class="modal-actions">
                <button onclick="window.confirmarSaida(true)" class="btn-entrar btn-rosa tap-feedback">SIM, QUERO SAIR</button>
                <button onclick="window.confirmarSaida(false)" class="cancel-link">CANCELAR E VOLTAR</button>
            </div>
        </div>
    </div>

    <div id="modal-duplicado" class="modal-overlay hidden">
        <div class="modal-centered pop-in">
            <div class="modal-icon modal-info">ℹ️</div>
            <h3>Produto já adicionado!</h3>
            <p class="modal-msg" id="msg-duplicado"></p>
            <div class="modal-actions">
                <button id="btn-confirmar-dup" class="btn-entrar tap-feedback">SIM, SOMAR</button>
                <button onclick="fecharModalDuplicado()" class="cancel-link">CANCELAR</button>
            </div>
        </div>
    </div>

    <div id="modal-peso-alto" class="modal-overlay hidden">
        <div class="modal-centered pop-in">
            <div class="modal-icon modal-warning">⚠️</div>
            <h3>Peso elevado!</h3>
            <p class="modal-msg" id="msg-peso-alto"></p>
            <div class="modal-actions">
                <button id="btn-confirmar-peso" class="btn-entrar tap-feedback">SIM, CONFIRMAR</button>
                <button onclick="fecharModalPesoAlto()" class="cancel-link">CANCELAR</button>
            </div>
        </div>
    </div>

    <div id="modal-envio" class="modal-overlay hidden">
        <div class="modal-centered pop-in">
            <div class="modal-icon modal-success">📤</div>
            <h3>Confirmar Envio?</h3>
            <p class="modal-msg" id="msg-envio"></p>
            <div class="modal-actions">
                <button id="btn-confirmar-envio" class="btn-entrar tap-feedback">SIM, ENVIAR LOTE</button>
                <button onclick="fecharModalEnvio()" class="cancel-link">CANCELAR E VOLTAR</button>
            </div>
        </div>
    </div>

    <div id="modal-sucesso" class="modal-overlay hidden">
        <div class="modal-centered pop-in">
            <div class="modal-icon modal-success">✅</div>
            <h3>Lote Enviado!</h3>
            <p class="modal-msg">Lote enviado com sucesso para a Gestão!</p>
            <div class="modal-actions">
                <button onclick="fecharModalSucesso()" class="btn-entrar tap-feedback">OK, ENTENDI</button>
            </div>
        </div>
    </div>

    <div id="modal-erro" class="modal-overlay hidden">
        <div class="modal-centered pop-in">
            <div class="modal-icon modal-error">⚠️</div>
            <h3>Atenção</h3>
            <p class="modal-msg" id="msg-erro"></p>
            <div class="modal-actions">
                <button onclick="fecharModalErro()" class="btn-entrar btn-rosa tap-feedback">ENTENDI</button>
            </div>
        </div>
    </div>

    <div id="modal-global" class="modal-overlay hidden">
        <div class="modal-centered pop-in">
            <div class="modal-icon">⚠️</div>
            <h3 id="modalTitulo">Título</h3>
            <p class="modal-msg" id="modalMensagem"></p>
            <div class="modal-actions">
                <button id="modalConfirmar" class="btn-entrar tap-feedback">OK</button>
                <button id="modalCancelar" class="cancel-link">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- ═══ LAYOUT ═══ -->
    <div class="app-container">

        <!-- Header -->
        <header class="header-app">
            <div>
                <div class="badge-loja">📍 <span id="display-loja">LOJA</span></div>
                <h1 class="nome-operador" id="display-operador">Operador</h1>
            </div>
            <div class="header-actions">
                <button onclick="window.abrirModalSair()" class="btn-outline btn-sair-header tap-feedback">
                    SAIR
                </button>
            </div>
        </header>

        <!-- Card principal: busca + peso + adicionar -->
        <main class="glass-card overlay fade-in-up lancamento-main">

            <div class="campo-bloco">
                <label class="campo-label">🔍 Buscar Produto</label>
                <div class="campo-busca-wrapper">
                    <input
                        type="text"
                        id="busca-produto"
                        placeholder="Nome ou código..."
                        class="input-premium"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="words"
                        spellcheck="false"
                    >
                    <!-- ID original: sugestoes -->
                    <div id="sugestoes" class="hidden sugestoes-box"></div>
                </div>
            </div>

            <!-- Área de produto manual (oculta por padrão, app.js controla) -->
            <div id="manual-area" class="manual-area hidden">
                <input type="text" id="manual-name" class="input-premium" placeholder="Nome do produto">
                <div class="unit-toggle">
                    <button class="unit-btn active tap-feedback" id="manual-kg" onclick="setManualUnit('KG')">KG</button>
                    <button class="unit-btn tap-feedback" id="manual-un" onclick="setManualUnit('UN')">UN</button>
                </div>
                <button onclick="confirmarManual()" class="btn-entrar btn-confirmar-produto tap-feedback">
                    CONFIRMAR PRODUTO
                </button>
            </div>

            <!-- Toggle de unidade do catálogo (app.js mostra/oculta) -->
            <div id="unit-toggle-catalog" class="hidden fade-in-up campo-toggle-unidade">
                <label class="campo-label campo-label-sm">⚖️ Tipo de medida</label>
                <div class="unit-toggle">
                    <button class="unit-btn active tap-feedback" id="cat-kg" onclick="setCatUnit('KG')">KG</button>
                    <button class="unit-btn tap-feedback" id="cat-un" onclick="setCatUnit('UN')">UN</button>
                </div>
            </div>

            <!-- Input de peso/quantidade -->
            <div class="campo-peso-bloco">
                <label id="label-peso-titulo" class="campo-label">📦 Quantidade / Peso</label>
                <div class="peso-wrapper">
                    <input
                        type="text"
                        id="peso-input"
                        placeholder="0,000"
                        class="input-peso"
                        inputmode="decimal"
                    >
                    <span id="label-unidade" class="label-unidade-peso">KG</span>
                </div>
            </div>

            <!-- Botão Adicionar -->
            <button id="btn-adicionar" class="btn-entrar btn-adicionar-lote tap-feedback">
                ➕ ADICIONAR AO LOTE
            </button>
        </main>

        <!-- Lotes enviados hoje -->
        <div id="secao-lotes-hoje">
            <div class="lotes-hoje-header">✅ Enviados hoje</div>
            <div id="lotes-hoje-lista"></div>
        </div>

        <!-- Lista de itens no lote atual (app.js popula) -->
        <div id="lista-conferencia" class="lista-conferencia-box"></div>

        <!-- Footer com total e botão finalizar -->
        <footer class="footer-action">
            <div>
                <span class="footer-total-label">TOTAL DO LOTE</span>
                <span id="total-itens" class="footer-total-numero">0</span>
            </div>
            <button id="btn-finalizar-lote" class="btn-entrar btn-finalizar-lote tap-feedback">
                📤 FINALIZAR
            </button>
        </footer>

    </div><!-- /app-container -->

    <script src="js/modal.js?v=3.4"></script>
    <script type="module" src="js/app.js?v=3.4"></script>
</body>
</html>
